{% extends "base.html" %}
{% load static %}

{% block title %}You AI — Confirm Sign In{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/nickname.css' %}">
<style>
    .auth-wrap {
        background-image: url("{% static 'images/nature.jpg' %}");
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="brand">
            <img src="{% static 'favicons/android-chrome-192x192.png' %}" alt="You AI Logo" class="brand-logo">
            You AI
        </h1>
        <p class="tagline">Connect Google Account</p>

        <p style="font-size: 14px; color: var(--muted); margin-bottom: 20px;">
            You are about to sign in using your Google account.
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" style="width: 100%;">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
