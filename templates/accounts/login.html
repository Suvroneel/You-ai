{% extends "base.html" %}
{% load socialaccount %}

{% block title %} You AI   Sign In{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="brand"> You AI</h1>
        <p class="tagline">The self, extended.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="oauth-section" style="margin-top: 2rem; text-align: center;">
            <a href="{% provider_login_url 'google' %}" class="btn-google" style="display: inline-block; padding: 12px 24px; background: #4285F4; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">
                Sign in with Google
            </a>
        </div>
    </div>
</div>
{% endblock %}
